[package]
name = "clipvault-app"
version = "0.3.8"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ahsoggg-creator/clipvault"

[[bin]]
name = "Clipvault"
path = "src/main.rs"

[dependencies]
clipvault-core = { version = "0.3.8", path = "../core" }
eframe = "0.36.2"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.4.2", default-features = false, features = ["native-tls", "gzip"] }

[build-dependencies]
embed-resource = "3.0.12"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_SystemServices", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_UI_HiDpi"] }
