name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --release
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: clipvault-test-build
          path: |
            target/release/Clipvault.exe
            target/release/clipvault-cli.exe
          retention-days: 3

  # Needs a real interactive desktop (clipboard, hotkey, SendInput). If the runner session does not give one
  # the step fails without failing the build: the local result of scripts/e2e.ps1 is what counts for a release.
  e2e:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: End-to-end check (clipboard, hotkey, paste, installer)
        timeout-minutes: 10
        shell: pwsh
        run: .\scripts\e2e.ps1

  # README screenshots from the demo data (made-up entries), rendered on a clean machine so that nobody has to
  # watch windows pop up on their own desktop. The files are an artifact: download and commit them.
  screenshots:
    needs: build
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Render the demo screenshots
        timeout-minutes: 10
        shell: pwsh
        run: .\scripts\screenshots.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/*.png
          retention-days: 7
